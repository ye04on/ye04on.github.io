<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR 인생네컷</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
      min-height: 100vh;
    }
    h1 { font-size: 18px; font-weight: 500; letter-spacing: 0.05em; color: #222; }
    #sticker-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #sticker-btns button {
      font-size: 20px; padding: 8px 12px;
      border-radius: 10px; border: 1.5px solid #ddd;
      background: #fff; cursor: pointer; transition: border-color 0.15s;
    }
    #sticker-btns button.active { border-color: #7F77DD; background: #EEEDFE; }
    #main-layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
    #cam-wrap {
      position: relative; width: 320px; height: 240px;
      border-radius: 12px; overflow: hidden;
      border: 1px solid #ddd; background: #e8e8e8;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
    #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #countdown {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 72px; font-weight: 700; color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5); display: none; z-index: 10;
    }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; }
    #strip-wrap {
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px; background: #fff; border-radius: 10px;
      border: 1px solid #ddd;
    }
    .strip-label { font-size: 9px; color: #bbb; text-align: center; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 2px; }
    .thumb {
      width: 140px; height: 105px; border-radius: 6px;
      background: #f0f0f0; display: flex; align-items: center;
      justify-content: center; overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-empty { color: #ccc; font-size: 20px; }
    #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #controls button {
      font-size: 13px; padding: 10px 20px; border-radius: 10px;
      cursor: pointer; border: 1px solid #ddd; background: #fff; color: #222;
      transition: background 0.1s;
    }
    #controls button:hover { background: #f5f5f5; }
    #shoot-btn { background: #222 !important; color: #fff !important; border-color: #222 !important; font-weight: 500; }
    #shoot-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #download-btn { background: #7F77DD !important; color: #fff !important; border-color: #7F77DD !important; display: none; }
    #reset-btn { display: none; }
    #status { font-size: 12px; color: #888; text-align: center; min-height: 18px; }
  </style>
</head>
<body>

  <h1>AR 인생네컷 📸</h1>

  <div id="sticker-btns">
    <button data-sticker="none" class="active" title="없음">✕</button>
    <button data-sticker="crown" title="왕관">👑</button>
    <button data-sticker="hud" title="게임 HUD">🎮</button>
    <button data-sticker="star" title="별">⭐</button>
    <button data-sticker="heart" title="하트">💖</button>
  </div>

  <div id="main-layout">
    <div id="cam-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay-canvas"></canvas>
      <div id="countdown"></div>
      <div id="flash"></div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div class="strip-label">PHOTO STRIP</div>
      <div id="strip-wrap">
        <div class="thumb" id="t0"><span class="thumb-empty">1</span></div>
        <div class="thumb" id="t1"><span class="thumb-empty">2</span></div>
        <div class="thumb" id="t2"><span class="thumb-empty">3</span></div>
        <div class="thumb" id="t3"><span class="thumb-empty">4</span></div>
      </div>
    </div>
  </div>

  <div id="status">카메라 켜기 버튼을 눌러주세요</div>

  <div id="controls">
    <button id="start-btn">카메라 켜기</button>
    <button id="shoot-btn" disabled>📸 촬영 (<span id="shot-count">0</span>/4)</button>
    <button id="download-btn">💾 저장하기</button>
    <button id="reset-btn">🔄 다시찍기</button>
  </div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const oc = overlayCanvas.getContext('2d');
    const hiddenCanvas = document.getElementById('hidden-canvas');
    const hc = hiddenCanvas.getContext('2d');
    const countdownEl = document.getElementById('countdown');
    const flashEl = document.getElementById('flash');
    const statusEl = document.getElementById('status');
    const shotCountEl = document.getElementById('shot-count');

    let stream = null;
    let selectedSticker = 'none';
    let shots = [];
    let shooting = false;
    let animId = null;

    const STICKERS = {
      none: null,
      crown: { emoji: '👑', x: 0.5, y: 0.05, size: 0.22 },
      star:  { emoji: '⭐', x: 0.15, y: 0.1,  size: 0.14 },
      heart: { emoji: '💖', x: 0.82, y: 0.08, size: 0.14 },
    };

    document.querySelectorAll('#sticker-btns button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#sticker-btns button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSticker = btn.dataset.sticker;
      });
    });

    document.getElementById('start-btn').addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          overlayCanvas.width = video.videoWidth || 320;
          overlayCanvas.height = video.videoHeight || 240;
          hiddenCanvas.width = video.videoWidth || 320;
          hiddenCanvas.height = video.videoHeight || 240;
          startOverlay();
        };
        document.getElementById('start-btn').disabled = true;
        document.getElementById('shoot-btn').disabled = false;
        statusEl.textContent = '준비 완료! 📸 버튼으로 촬영하세요';
      } catch(e) {
        statusEl.textContent = '카메라 접근이 거부됐어요. 브라우저 설정을 확인해주세요.';
      }
    });

    document.getElementById('shoot-btn').addEventListener('click', () => {
      if (shooting || shots.length >= 4) return;
      runCountdown();
    });

    document.getElementById('download-btn').addEventListener('click', downloadStrip);
    document.getElementById('reset-btn').addEventListener('click', reset);

    function startOverlay() {
      function loop() {
        if (!video.videoWidth) { animId = requestAnimationFrame(loop); return; }
        oc.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        drawSticker(oc, overlayCanvas.width, overlayCanvas.height);
        animId = requestAnimationFrame(loop);
      }
      loop();
    }

    function drawSticker(ctx, w, h) {
      if (selectedSticker === 'hud') { drawHUD(ctx, w, h); return; }
      const s = STICKERS[selectedSticker];
      if (!s) return;
      ctx.save();
      const size = s.size * w;
      ctx.font = `${size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(s.emoji, s.x * w, s.y * h);
      ctx.restore();
    }

    function drawHUD(ctx, w, h) {
      ctx.save();
      ctx.strokeStyle = 'rgba(80,255,180,0.9)';
      ctx.fillStyle = 'rgba(80,255,180,0.9)';
      ctx.lineWidth = 1.5;
      ctx.font = '11px monospace';

      const corners = [
        [16, 16, 1, 1], [w-16, 16, -1, 1],
        [16, h-16, 1, -1], [w-16, h-16, -1, -1],
      ];
      corners.forEach(([cx, cy, dx, dy]) => {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + dx*20, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + dy*20); ctx.stroke();
      });

      ctx.globalAlpha = 0.75;
      ctx.fillText('HP ████████░░ 80%', 24, h - 34);
      ctx.fillText('LV.99', w - 55, 18);

      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = 'rgba(80,255,180,0.5)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(w/2 - 28, h/2 - 28, 56, 56);
      ctx.beginPath(); ctx.moveTo(w/2 - 8, h/2); ctx.lineTo(w/2 + 8, h/2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w/2, h/2 - 8); ctx.lineTo(w/2, h/2 + 8); ctx.stroke();
      ctx.restore();
    }

    function runCountdown() {
      shooting = true;
      document.getElementById('shoot-btn').disabled = true;
      let n = 3;
      countdownEl.style.display = 'block';
      countdownEl.textContent = n;
      const interval = setInterval(() => {
        n--;
        if (n > 0) {
          countdownEl.textContent = n;
        } else {
          clearInterval(interval);
          countdownEl.style.display = 'none';
          captureFrame();
        }
      }, 900);
    }

    function captureFrame() {
      const w = video.videoWidth || 320;
      const h = video.videoHeight || 240;
      hiddenCanvas.width = w; hiddenCanvas.height = h;
      hc.save();
      hc.translate(w, 0); hc.scale(-1, 1);
      hc.drawImage(video, 0, 0, w, h);
      hc.restore();
      drawSticker(hc, w, h);

      flashEl.style.transition = 'opacity 0.05s';
      flashEl.style.opacity = '0.9';
      setTimeout(() => { flashEl.style.transition = 'opacity 0.3s'; flashEl.style.opacity = '0'; }, 80);

      const dataURL = hiddenCanvas.toDataURL('image/jpeg', 0.92);
      shots.push(dataURL);

      const thumb = document.getElementById(`t${shots.length - 1}`);
      thumb.innerHTML = '';
      const img = document.createElement('img');
      img.src = dataURL; thumb.appendChild(img);

      shotCountEl.textContent = shots.length;
      shooting = false;

      if (shots.length < 4) {
        statusEl.textContent = `${shots.length}컷 완료! ${4 - shots.length}컷 더 찍어보세요`;
        document.getElementById('shoot-btn').disabled = false;
      } else {
        statusEl.textContent = '4컷 완성! 저장 버튼을 눌러보세요 🎉';
        document.getElementById('shoot-btn').disabled = true;
        document.getElementById('download-btn').style.display = '';
        document.getElementById('reset-btn').style.display = '';
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (animId) cancelAnimationFrame(animId);
      }
    }

    function downloadStrip() {
      if (shots.length < 4) return;
      const fw = 160, fh = 120, pad = 6, border = 16;
      const sc = document.createElement('canvas');
      sc.width = fw + border * 2;
      sc.height = (fh * 4) + (pad * 3) + border * 2 + 24;
      const sctx = sc.getContext('2d');
      sctx.fillStyle = '#fff';
      sctx.fillRect(0, 0, sc.width, sc.height);
      const promises = shots.map((src, i) => new Promise(res => {
        const img = new Image();
        img.onload = () => { sctx.drawImage(img, border, border + i * (fh + pad), fw, fh); res(); };
        img.src = src;
      }));
      Promise.all(promises).then(() => {
        sctx.fillStyle = '#bbb';
        sctx.font = '9px monospace';
        sctx.textAlign = 'center';
        sctx.fillText('PHOTO STRIP', sc.width / 2, sc.height - 6);
        const a = document.createElement('a');
        a.download = 'photostrip.jpg';
        a.href = sc.toDataURL('image/jpeg', 0.95);
        a.click();
      });
    }

    function reset() {
      shots = [];
      shotCountEl.textContent = '0';
      for (let i = 0; i < 4; i++) {
        document.getElementById(`t${i}`).innerHTML = `<span class="thumb-empty">${i+1}</span>`;
      }
      document.getElementById('download-btn').style.display = 'none';
      document.getElementById('reset-btn').style.display = 'none';
      document.getElementById('start-btn').disabled = false;
      document.getElementById('shoot-btn').disabled = true;
      statusEl.textContent = '카메라 켜기 버튼을 눌러주세요';
      if (animId) cancelAnimationFrame(animId);
    }
  </script>
</body>
</html>
